security:
  password_hashers:
    App\Entity\User:
      algorithm: auto

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    main:
      provider: app_user_provider
      form_login:
        login_path: login
        check_path: login
        default_target_path: homepage
      logout:
        path: logout
        target: homepage

  access_control:
    - { path: ^/admin, roles: ROLE_ADMIN }
